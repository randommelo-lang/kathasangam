<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KathaSangam – Stories in Motion</title>
  <meta name="description" content="A modern publishing platform for serialized web novels and chitrānk.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=auth-tabs-20260619-v29">
</head>
<body>

  <!-- ─── Top Bar / Hero Bar ─── -->
  <header class="hero-bar" id="heroBar">
    <div class="hero-bar-inner">
      <a class="brand" href="#discover" aria-label="KathaSangam home">
        <span class="brand-mark" aria-hidden="true">KS</span>
        <span class="brand-text">KathaSangam(β)</span>
      </a>

      <nav class="nav-links" aria-label="Sections">
        <a href="#discover" data-nav="discover" class="active">Discover</a>
        <a href="#library" data-nav="library">Library</a>
        <a href="#reader" data-nav="reader">Reader</a>
        <a href="#studio" data-nav="studio">Studio</a>
        <a href="#moderation" data-nav="moderation" hidden>Moderation</a>
      </nav>

      <div class="hero-bar-right">
        <div class="searchbar" role="search">
          <label class="sr-only" for="searchInput">Search stories, authors, and tags</label>
          <input id="searchInput" type="search" placeholder="Search stories…">
          <label class="sr-only" for="genreFilter">Genre filter</label>
          <select id="genreFilter">
            <option value="all">All genres</option>
          </select>
        </div>

        <!-- Auth area: shown based on login state -->
        <div id="authArea" class="auth-area">
          <button id="signInBtn" class="btn primary auth-signin-btn" type="button">Log In</button>
        </div>
        <div id="heroNotificationArea" class="hero-notification-area"></div>
      </div>
    </div>
  </header>

  <!-- ─── Auth Modal ─── -->
  <div id="authModal" class="auth-modal-backdrop" hidden>
    <div class="auth-modal" role="dialog" aria-labelledby="authModalTitle" aria-modal="true">
      <button class="auth-modal-close" id="authModalClose" type="button" aria-label="Close">&times;</button>

      <div class="auth-modal-header">
        <span class="brand-mark auth-modal-logo" aria-hidden="true">KS</span>
        <h2 id="authModalTitle" class="auth-modal-title">Welcome back</h2>
        <p class="auth-modal-subtitle">Log in to your KathaSangam account</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login" type="button">Log In</button>
        <button class="auth-tab" data-auth-tab="signup" type="button">Sign Up</button>
      </div>

      <div id="authError" class="auth-error" hidden></div>
      <div id="authSuccess" class="auth-success" hidden></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn primary auth-submit-btn">Log In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" class="auth-form" hidden autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
        </label>
        <label class="field">
          <span>Confirm Password</span>
          <input type="password" name="confirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" class="btn primary auth-submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ─── Create Story Modal ─── -->
  <div id="storyModal" class="auth-modal-backdrop" hidden>
    <div class="auth-modal" role="dialog" aria-labelledby="storyModalTitle" aria-modal="true">
      <button class="auth-modal-close" id="storyModalClose" type="button" aria-label="Close">&times;</button>
      <div class="auth-modal-header">
        <span class="brand-mark auth-modal-logo" aria-hidden="true">KS</span>
        <h2 id="storyModalTitle" class="auth-modal-title">Create New Story</h2>
        <p class="auth-modal-subtitle">Start your series on KathaSangam</p>
      </div>
      <div id="storyModalContent"></div>
    </div>
  </div>

  <!-- ─── Main Content ─── -->
  <main class="main">
    <h1 id="pageTitle" class="sr-only">Discover</h1>
    <section id="alerts" class="alerts" aria-live="polite" aria-atomic="true"></section>
    <section id="view" class="view" tabindex="-1"></section>
  </main>

  <!-- ─── Story Card Template ─── -->
  <template id="storyCardTemplate">
    <article class="story-card">
      <button class="cover-button" type="button" aria-label="Story cover">
        <span class="cover-art" aria-hidden="true"></span>
        <span class="cover-badge"></span>
        <div class="cover-hover">
          <span class="cover-hover-label">Read →</span>
        </div>
      </button>
      <div class="story-body">
        <div class="story-meta"></div>
        <h2></h2>
        <p></p>
        <div class="tag-row"></div>
        <div class="story-actions"></div>
      </div>
    </article>
  </template>

  <!-- Supabase JS Client -->
  <script src="js/vendor/supabase.min.js" integrity="sha384-GMmlk3PgEaV4QITo1ucN4bsD8RYSEL/EIfi3r1o+fi2ZOqjwXBDr5HvUyyt8XBBB" crossorigin="anonymous"></script>
  <!-- Mammoth.js for docx text extraction -->
  <script src="js/vendor/mammoth.browser.min.js" integrity="sha384-nFoSjZIoH3CCp8W639jJyQkuPHinJ2NHe7on1xvlUA7SuGfJAfvMldrsoAVm6ECz" crossorigin="anonymous"></script>
  <!-- PDF.js for pdf text extraction -->
  <script src="js/vendor/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js?v=auth-tabs-20260619-v29"></script>
</body>
</html>
