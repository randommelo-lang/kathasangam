<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gold/Amber Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm Gold Gradient for Quill -->
    <linearGradient id="quillGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5308" />
      <stop offset="35%" stop-color="#d48c1f" />
      <stop offset="70%" stop-color="#f5cc68" />
      <stop offset="100%" stop-color="#fff2b3" />
    </linearGradient>

    <!-- Secondary gradient for quill shaft/highlights -->
    <linearGradient id="shaftGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5cc68" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Gold Glow Underlay -->
  <g filter="url(#goldGlow)" opacity="0.55">
    <!-- Quill Outline copy -->
    <path d="M 88 22 C 84 22, 60 38, 48 60 Q 40 76, 28 88 L 36 94 Q 48 84, 62 74 C 82 60, 94 36, 88 22 Z" fill="#d48c1f" />
    <path d="M 30 96 C 45 90, 52 102, 70 96 Q 80 93, 85 97" fill="none" stroke="#d48c1f" stroke-width="4" />
  </g>

  <!-- Quill Nib & Pen body (bottom-left) -->
  <path d="M 28 92 L 34 94 L 38 88 L 30 84 Z" fill="url(#shaftGold)" />
  
  <!-- Quill Nib Split line -->
  <line x1="28" y1="92" x2="33" y2="87" stroke="#3d2100" stroke-width="1" />

  <!-- Main Quill Feather Plume -->
  <path d="M 88 22 
           C 82 22, 74 27, 65 35 
           Q 67 40, 71 38 
           C 60 48, 52 60, 46 72 
           Q 49 76, 54 73 
           C 44 83, 37 92, 34 94 
           C 38 94, 43 89, 44 91 
           C 47 85, 54 75, 62 67 
           Q 60 63, 57 65 
           C 67 55, 76 45, 84 37 
           Q 81 33, 78 35 
           C 87 27, 91 24, 88 22 Z" 
        fill="url(#quillGold)" />

  <!-- Shaft/Stem of the Quill -->
  <path d="M 29 93 Q 56 65, 87 23" fill="none" stroke="url(#shaftGold)" stroke-width="2" stroke-linecap="round" />

  <!-- Signature Squiggle at the bottom -->
  <path d="M 30 96 C 45 90, 52 102, 70 96 Q 80 93, 85 97" 
        fill="none" 
        stroke="url(#quillGold)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Ink droplet shine -->
  <circle cx="28" cy="92" r="1.5" fill="#ffffff" />
</svg>
