<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Blue/Indigo Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Indigo/Blue Gradient for Book Cover and Pages -->
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e65ff" />
      <stop offset="100%" stop-color="#92effd" />
    </linearGradient>

    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a0b0ff" />
      <stop offset="48%" stop-color="#f0f4ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="52%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#a0b0ff" />
    </linearGradient>

    <linearGradient id="spineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b4ccc" />
      <stop offset="100%" stop-color="#141c66" />
    </linearGradient>
  </defs>

  <!-- Blue Glow Underlay -->
  <g filter="url(#blueGlow)" opacity="0.6">
    <path d="M 60 42 C 45 32, 25 38, 20 40 L 20 74 C 25 72, 45 66, 60 76 C 75 66, 95 72, 100 74 L 100 40 C 95 38, 75 32, 60 42 Z" fill="#4e65ff" />
  </g>

  <!-- Book Cover Base (Shadow/Backing) -->
  <path d="M 18 42 
           C 25 40, 48 34, 60 44 
           C 72 34, 95 40, 102 42 
           L 102 78 
           C 95 76, 72 70, 60 80 
           C 48 70, 25 76, 18 78 Z" 
        fill="url(#bookCover)" />

  <!-- Stacked Page Layers (Depth Effect) -->
  <path d="M 19 44 C 25 42, 48 36, 60 46 C 72 36, 95 42, 101 44 L 101 76 C 95 74, 72 68, 60 78 C 48 68, 25 74, 19 76 Z" fill="#d2daff" />
  <path d="M 20 46 C 25 44, 48 38, 60 48 C 72 38, 95 44, 100 46 L 100 74 C 95 72, 72 66, 60 76 C 48 66, 25 72, 20 74 Z" fill="#e8ebff" />

  <!-- Top Pages Layer -->
  <path d="M 21 47 
           C 26 45, 48 40, 60 49 
           C 72 40, 94 45, 99 47 
           L 99 73 
           C 94 71, 72 66, 60 75 
           C 48 66, 26 71, 21 73 Z" 
        fill="url(#pageGradient)" />

  <!-- Spine/Center Fold Shadow -->
  <path d="M 59 47 Q 60 46, 61 47 L 61 76 Q 60 78, 59 76 Z" fill="url(#spineGradient)" />

  <!-- Page Lines (Faint Content Representation) -->
  <!-- Left Page Lines -->
  <path d="M 30 54 Q 42 50, 52 54 M 30 60 Q 42 56, 52 60 M 30 66 Q 42 62, 52 66" stroke="#8795d6" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  
  <!-- Right Page Lines -->
  <path d="M 68 54 Q 78 50, 90 54 M 68 60 Q 78 56, 90 60 M 68 66 Q 78 62, 90 66" stroke="#8795d6" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Bookmark Ribbon hanging from center -->
  <path d="M 60 49 L 60 84 L 64 88 L 64 49" fill="#ff4b5c" opacity="0.9" />
</svg>
