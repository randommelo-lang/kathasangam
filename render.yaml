services:
  # 1. Rust API Backend
  - type: web
    name: kathasangam-backend
    env: rust
    rootDir: backend
    plan: free
    buildCommand: cargo build --release --bin kathasangam-backend
    startCommand: ./target/release/kathasangam-backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SERVE_FRONTEND
        value: "false"
      # SB-01: never honour mock access tokens in production. The release build
      # already defaults this to false; set it explicitly so the intent survives
      # a future change to the debug fallback.
      - key: ALLOW_MOCK_AUTH
        value: "false"
      # SB-12: require a second factor on account deletion, data export and role
      # changes. Users without an enrolled factor must enrol before those actions.
      - key: MFA_REQUIRED_FOR_SENSITIVE_ACTIONS
        value: "true"
      # SB-10/SB-17: headers such as cf-ipcountry are only believed from these peers.
      - key: TRUSTED_PROXIES
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://kathasangam-frontend.onrender.com,https://kathasangam.co.in,https://www.kathasangam.co.in"
      - key: ADMIN_EMAIL
        sync: false
      - key: MODERATOR_EMAILS
        sync: false

  # 2. Static Frontend
  - type: web
    name: kathasangam-frontend
    runtime: static
    buildCommand: node scripts/build-frontend.mjs
    staticPublishPath: ./dist/public
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kathasangam-backend.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://kathasangam-backend.onrender.com/uploads/*
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://*.kathasangam.co.in https://kathasangam.co.in https://*.onrender.com https://onrender.com https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-ancestors 'none';"
      - path: /*.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ico)
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
