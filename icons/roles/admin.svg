<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gold/Copper Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2608" />
      <stop offset="25%" stop-color="#9f4f1b" />
      <stop offset="50%" stop-color="#e57c33" />
      <stop offset="75%" stop-color="#f9b282" />
      <stop offset="100%" stop-color="#fddcc5" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow Effect -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Secondary inner dark shadow for 3D depth -->
    <linearGradient id="darkGoldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd2b3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2a0f00" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Orange Glow underlay (semi-transparent copy) -->
  <g filter="url(#orangeGlow)" opacity="0.6">
    <path d="M 30 84 H 90 V 88 H 30 Z" fill="#e57c33" />
    <path d="M 28 89 H 92 V 93 H 28 Z" fill="#e57c33" />
    <path d="M 30 80 L 22 46 L 42 60 L 60 22 L 78 60 L 98 46 L 90 80 Z" fill="#e57c33" />
  </g>

  <!-- Main Crown Shape -->
  <g fill="url(#goldGradient)">
    <!-- Crown Body -->
    <path d="M 30 80 L 22 46 L 42 60 L 60 22 L 78 60 L 98 46 L 90 80 Z" />
    
    <!-- Outer Base Rim -->
    <path d="M 30 83 C 30 81.5, 90 81.5, 90 83 L 90 87 C 90 88.5, 30 88.5, 30 87 Z" />
    
    <!-- Bottom Base Ring -->
    <path d="M 27 88 C 27 86.5, 93 86.5, 93 88 L 93 92 C 93 93.5, 27 93.5, 27 92 Z" />
  </g>

  <!-- 3D Shading Overlay -->
  <path d="M 30 80 L 22 46 L 42 60 L 60 22 L 78 60 L 98 46 L 90 80 Z" fill="url(#darkGoldGradient)" style="mix-blend-mode: multiply;" />

  <!-- Diamond Cutout in Center Peak -->
  <polygon points="60,49 67,58 60,67 53,58" fill="#140b05" />

  <!-- Jewels on the Peak Tips -->
  <g fill="url(#goldGradient)">
    <!-- Left Peak Diamond Jewel -->
    <polygon points="22,34 27,39 22,44 17,39" />
    <polygon points="22,34 27,39 22,44 17,39" fill="#ffffff" opacity="0.3" />

    <!-- Center Peak Diamond Jewel -->
    <polygon points="60,10 65,15 60,20 55,15" />
    <polygon points="60,10 65,15 60,20 55,15" fill="#ffffff" opacity="0.5" />

    <!-- Right Peak Diamond Jewel -->
    <polygon points="98,34 103,39 98,44 93,39" />
    <polygon points="98,34 103,39 98,44 93,39" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Highlights/Gleam -->
  <circle cx="60" cy="15" r="1.5" fill="#ffffff" />
  <circle cx="22" cy="39" r="1" fill="#ffffff" />
  <circle cx="98" cy="39" r="1" fill="#ffffff" />
  <polygon points="60,52 64,58 60,64 56,58" fill="#fdc5a0" opacity="0.5" />
</svg>
